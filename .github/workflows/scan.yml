name: Security Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Build scanner Docker image
        run: |
          docker build -t vuln-scanner:local .

      - name: Run vulnerability scan
        continue-on-error: true
        run: |
          python -m scanner.scan python:3.8 --output-json scan_result.json

      - name: Upload scan result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-result
          path: scan_result.json

      - name: Check security gate
        run: |
          python scanner/gate_check.py scan_result.json
